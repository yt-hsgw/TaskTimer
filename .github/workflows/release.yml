name: リリースビルド

on:
  workflow_dispatch:
  push:
    tags:
      - "app-v*"

permissions:
  contents: read

jobs:
  prepare-release:
    name: Release対象決定
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.matrix.outputs.build_matrix }}
    steps:
      - name: チェックアウト
        uses: actions/checkout@v5

      - name: Release artifact対象を検証
        run: npm run check:release-platform-policy

      - name: ビルド対象matrixを決定
        id: matrix
        shell: bash
        run: |
          echo 'build_matrix={"include":[{"label":"Windows","platform":"windows-latest","rustTarget":"","args":""}]}' >> "$GITHUB_OUTPUT"

  build-release:
    name: ${{ matrix.label }}
    needs:
      - prepare-release
    if: ${{ always() && needs.prepare-release.result == 'success' }}
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-release.outputs.build_matrix) }}

    steps:
      - name: チェックアウト
        uses: actions/checkout@v5

      - name: Node.jsを準備
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Rustを準備
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          if [ -n "${{ matrix.rustTarget }}" ]; then
            rustup target add "${{ matrix.rustTarget }}"
          fi

      - name: Node依存関係をインストール
        run: npm ci

      - name: npm脆弱性監査を実行
        run: npm audit --audit-level=moderate

      - name: フロントエンドをビルド
        run: npm run build

      - name: TauriアプリをビルドしてDraft Releaseへ添付
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'app-v__VERSION__' }}
          releaseName: TaskTimer ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseBody: |
            ## ダウンロード

            - Windows: NSISインストーラーを利用してください。
            - macOS: 現時点では提供しません。

            ## 主な機能

            - タスクとサブタスクの作成、完了、削除。
            - タスクとサブタスクそれぞれの開始日、終了日、メモ、タイマー。
            - アプリ全体で同時に1件だけ開始できるタイマー。
            - 週表示カレンダーとローカル通知設定。

            ## 注意

            - アプリ実行時の外部通信はありません。
            - 自動更新はありません。新しいバージョンはGitHub Releasesで確認してください。
            - v0.1.0はWindows版を主配布対象にします。
            - Windows版はコード署名未設定のため、Windows SmartScreenまたは組織ポリシーの警告が表示される場合があります。
            - macOS版は現時点では配布対象外です。
            - Linux版、ストア配布、自動更新はこのReleaseの対象外です。

            ## 公開前確認

            公開前に該当バージョンの `docs/releases/<version>.md` とRelease Issueの手動確認結果へ、既知制限、手動確認結果、未解決の依存関係アラートの扱いを反映してください。
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          tauriScript: npm run tauri
          args: ${{ matrix.args }}
          releaseAssetNamePattern: "TaskTimer_[version]_[platform]_[arch][setup][ext]"
